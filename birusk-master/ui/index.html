<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlanCoreNet Master Panel</title>
    <style>
        /* --- متغیرهای رنگی و استایل‌های پایه --- */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #f43f5e;
            --telegram: #2eaadc;
        }
        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }
        
        /* --- منوی کناری (Sidebar) --- */
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s; z-index: 100; }
        .sidebar-header { padding: 24px; font-size: 1.5rem; font-weight: bold; color: var(--primary); text-align: center; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .nav-menu { flex: 1; padding: 20px 0; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 12px 24px; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); border-left: 4px solid var(--primary); }
        
        /* --- محتوای اصلی (Main Content) --- */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .topbar { background-color: var(--bg-card); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .content-area { padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        /* --- المان‌های رابط کاربری (UI Elements) --- */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; }
        .card-title { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px; }
        .card-value { font-size: 2rem; font-weight: bold; color: var(--text-main); }
        
        /* --- فرم‌ها و ورودی‌ها (Forms) --- */
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; flex: 1;}
        .form-row { display: flex; gap: 16px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }
        
        /* --- دکمه‌ها (Buttons) --- */
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px solid transparent; }
        .btn-telegram { background: rgba(46, 170, 220, 0.1); color: var(--telegram); border: 1px solid var(--telegram); }
        
        /* --- جداول (Tables) --- */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }
        
        /* --- نوارهای بصری (Visual Bars) --- */
        .visual-bar-container { width: 100%; background: var(--bg-base); border-radius: 4px; height: 8px; overflow: hidden; border: 1px solid var(--border); }
        .visual-bar { height: 100%; background: var(--primary); transition: width 0.3s; }
        
        /* --- سوییچ‌ها (Switches) --- */
        .switch-group { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }
        
        /* --- مۆدال‌ها (Modals / Popups) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal.open { display: flex; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 500px; padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; color: var(--text-main); font-size: 1.25rem; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        
        /* --- طراحی واکنش‌گرا (Mobile Responsive) --- */
        #mobile-menu-btn { display: none; background: none; color: var(--text-main); font-size: 1.5rem; padding: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; opacity: 0; transition: opacity 0.3s; }
        
        @media (max-width: 768px) {
            .sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            #mobile-menu-btn { display: block; }
            .form-row { flex-direction: column; gap: 0; }
            .content-area { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- === سایدبار (منوی سمت چپ) === -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            🐯 AlanCoreNet
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active" data-page="dashboard">
                <span style="font-size: 1.2rem;">📊</span> <span data-i18n="nav_dashboard">Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-page="users">
                <span style="font-size: 1.2rem;">👥</span> <span data-i18n="nav_users">Subscriptions</span>
            </a>
            <a href="#" class="nav-item" data-page="nodes">
                <span style="font-size: 1.2rem;">🌍</span> <span data-i18n="nav_nodes">Edge Nodes</span>
            </a>
            <a href="#" class="nav-item" data-page="settings">
                <span style="font-size: 1.2rem;">⚙️</span> <span data-i18n="nav_settings">Core Settings</span>
            </a>
        </nav>
    </aside>

    <!-- === محتوای اصلی (پنل سمت راست) === -->
    <main class="main-content">
        <header class="topbar">
            <div style="display: flex; align-items: center; gap: 16px;">
                <button id="mobile-menu-btn">☰</button>
                <h2 id="page-title" data-i18n="nav_dashboard" style="font-size: 1.25rem;">Dashboard</h2>
            </div>
            <div class="topbar-right">
                <select id="lang-selector" style="padding: 6px 12px; width: auto; background: var(--bg-base);">
                    <option value="en">English</option>
                    <option value="fa">فارسی</option>
                </select>
                <button id="theme-toggle" class="btn-secondary" style="padding: 8px; border-radius: 50%;">🌓</button>
            </div>
        </header>
        
        <div class="content-area" id="content">
            <!-- محتوای صفحات به صورت داینامیک توسط app.js در اینجا لود می‌شود -->
        </div>
    </main>

    <!-- === فرم مدیریت اشتراک‌ها (User Modal) === -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <h3 id="user-modal-title">Create Subscription</h3>
            <input type="hidden" id="form-user-id">
            
            <div class="form-group">
                <label style="font-weight:bold; margin-bottom:8px;">Name / Identifier</label>
                <input type="text" id="form-user-name" placeholder="e.g. Alan_VIP">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Data Limit (GB) - 0 for Unl</label>
                    <input type="number" id="form-user-limit" value="0">
                </div>
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Validity (Days) - 0 for Unl</label>
                    <input type="number" id="form-user-days" value="30">
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 10px;">
                <label style="font-weight:bold; margin-bottom:8px;">Enabled Protocols</label>
                <div style="display:flex; gap:16px; margin-top:8px; background: var(--bg-base); padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="form-user-vless" checked> VLESS</label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="form-user-trojan" checked> Trojan</label>
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" id="form-user-vmess" checked> VMess</label>
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 10px;">
                <label style="font-weight:bold; margin-bottom:8px;">Custom Remark (Optional)</label>
                <input type="text" id="form-user-remark" placeholder="e.g. VIP-Server">
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                <button class="btn-secondary" onclick="closeModal('user-modal')">Cancel</button>
                <button id="btn-save-user" onclick="submitUserForm()">Save & Deploy</button>
            </div>
        </div>
    </div>

    <!-- === فرم مدیریت نودها (Node Modal) === -->
    <div id="node-modal" class="modal">
        <div class="modal-content" style="max-width: 650px;">
            <h3 id="node-modal-title">Register Edge Node</h3>
            <input type="hidden" id="form-node-id">
            
            <div class="form-row">
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Node Name</label>
                    <input type="text" id="form-node-name" placeholder="e.g. Germany-1">
                </div>
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Node Type</label>
                    <select id="form-node-type">
                        <option value="cloudflare">Cloudflare (CDN Worker)</option>
                        <option value="railway">Railway / Direct Server</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Target Address (IP/Domain)</label>
                    <input type="text" id="form-node-addr" placeholder="e.g. proxy.domain.com">
                </div>
                <div class="form-group" style="max-width: 150px;">
                    <label style="font-weight:bold; margin-bottom:8px;">Node Port</label>
                    <input type="number" id="form-node-port" value="443">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Network Transport</label>
                    <select id="form-node-transport" onchange="toggleNodeFields()">
                        <option value="ws">WebSocket (WS)</option>
                        <option value="grpc">gRPC</option>
                        <option value="tcp">TCP (Raw)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="font-weight:bold; margin-bottom:8px;">Security / TLS</label>
                    <select id="form-node-security" onchange="toggleNodeFields()">
                        <option value="tls">Standard TLS</option>
                        <option value="reality">REALITY (Anti-DPI)</option>
                        <option value="none">None (Plain)</option>
                    </select>
                </div>
            </div>

            <!-- فیلدهای پیشرفته (REALITY / gRPC) که به صورت داینامیک با جاوااسکریپت نمایان می‌شوند -->
            <div id="advanced-fields" style="background: rgba(99,102,241,0.05); padding: 16px; border-radius: 8px; border: 1px dashed var(--primary); margin-top: 12px;">
                <div class="form-row">
                    <div class="form-group" id="group-path">
                        <label style="font-weight:bold; margin-bottom:8px;" id="label-path">Path / ServiceName</label>
                        <input type="text" id="form-node-path" value="/">
                    </div>
                    <div class="form-group" id="group-host">
                        <label style="font-weight:bold; margin-bottom:8px;">Host / SNI</label>
                        <input type="text" id="form-node-host" placeholder="e.g. speedtest.net">
                    </div>
                </div>
                <div class="form-row" id="group-reality" style="display: none;">
                    <div class="form-group">
                        <label style="font-weight:bold; margin-bottom:8px;">Public Key (PBK)</label>
                        <input type="text" id="form-node-pbk" placeholder="REALITY Public Key">
                    </div>
                    <div class="form-group">
                        <label style="font-weight:bold; margin-bottom:8px;">Short ID (SID)</label>
                        <input type="text" id="form-node-sid" placeholder="e.g. 1a2b3c4d">
                    </div>
                </div>
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                <button class="btn-secondary" onclick="closeModal('node-modal')">Cancel</button>
                <button id="btn-save-node" onclick="submitNodeForm()">Connect Node</button>
            </div>
        </div>
    </div>

    <!-- === اسکریپت‌های سیستمی و زبان === -->
    <script>
        const translations = {
            "en": {
                "nav_dashboard": "Dashboard",
                "nav_users": "Subscriptions",
                "nav_nodes": "Edge Nodes",
                "nav_settings": "Core Settings",
                "card_total_users": "Total Subscriptions",
                "card_active_nodes": "Online Edge Nodes",
                "table_name": "Client Identifier",
                "table_usage": "Data Utilization",
                "table_status": "Status",
                "btn_add_user": "+ Create Client Sub",
                "btn_add_node": "+ Register Edge Node"
            },
            "fa": {
                "nav_dashboard": "داشبورد",
                "nav_users": "مدیریت اشتراک‌ها",
                "nav_nodes": "نودهای زیرساخت",
                "nav_settings": "تنظیمات هسته",
                "card_total_users": "کل اشتراک‌ها",
                "card_active_nodes": "نودهای آنلاین",
                "table_name": "شناسه کاربر",
                "table_usage": "مصرف ترافیک",
                "table_status": "وضعیت",
                "btn_add_user": "+ ایجاد اشتراک جدید",
                "btn_add_node": "+ ثبت نود جدید"
            }
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
